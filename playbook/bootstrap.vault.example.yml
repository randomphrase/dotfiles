---
# Shape of a DECRYPTED per-host credentials Vault. No signing key belongs here.
# Create private/HOST.vault.yml with ansible-vault create.
# Optional: the remote account's sudo password.
# Omit for passwordless sudo, or use --ask-become-pass instead.
ansible_become_password: "YOUR_REMOTE_SUDO_PASSWORD"
# Use {} instead of the field above when the bundle has no credentials.
